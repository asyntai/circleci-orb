version: 2.1

# Build, test and publish the orb itself.
# Needs the context "orb-publishing" to hold CIRCLE_TOKEN.

orbs:
  orb-tools: circleci/orb-tools@12.3.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - orb-tools/install-cli
      - run:
          name: Generate the shell wrapper
          command: python build.py
      - run:
          name: Check that the wrapper in the repository is current
          command: git diff --exit-code src/scripts/sync.sh
      - run:
          name: Pack the orb
          command: circleci orb pack src > orb.yml
      - run:
          name: Test the packed orb
          command: |
            pip install pyyaml
            python tests/run_tests.py orb.yml

workflows:
  build-test-publish:
    jobs:
      - test

      - orb-tools/publish:
          orb_name: asyntai/ai-docs-sync
          vcs_type: github
          pub_type: production
          requires:
            - test
          context: orb-publishing
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/
